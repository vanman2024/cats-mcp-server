# Secret scanning for cats-mcp-server.
#
# This file replaced one copied from an unrelated project ("RedAI"), which was
# wrong here in three ways worth recording so it is not reintroduced:
#
#   1. It declared [[rules]] with no [extend], and in gitleaks that *replaces*
#      the ~170 built-in rules rather than adding to them. The repo was scanned
#      for Stripe, Clerk and Supabase keys - services this project does not use
#      - while AWS keys, GitHub tokens and private keys went unchecked.
#   2. Every rule was path-scoped to (\.md|\.mdx|\.txt|docs/), so source code
#      was never scanned for secrets at all. Only the docs were.
#   3. One rule used a negative lookahead, (?!your_|sk_test_|...). gitleaks
#      compiles with Go's re2, which has no lookaround, so the binary panicked
#      on startup and the scan never ran. An allowlist is how that exclusion is
#      expressed here - see [allowlist] below.

title = "cats-mcp-server"

[extend]
# The built-in ruleset is the point. Everything below is additive.
useDefault = true

[allowlist]
description = "Placeholders and vendored content that are not credentials"
regexes = [
  # Every credential this repo writes down is a placeholder that starts with
  # "your": CATS_API_KEY=your_cats_api_key_here in .env.example, `Authorization:
  # Token YOUR_API_KEY` in the cats-api skill's curl examples, and
  # CATS_API_KEY=your_actual_cats_api_key in the archived docs still reachable
  # through git history. One pattern covers all three, and it is deliberately
  # anchored to the "your" prefix so it cannot swallow a real key.
  '''(?i)\byour[_-][a-z0-9_\-]*''',
]
paths = [
  # Resolved hashes, not credentials. Generic high-entropy rules fire on them.
  '''uv\.lock''',
  '''\.venv/''',
]

# CATS is the one credential this server actually holds. The built-in ruleset
# has no rule for it, so it needs one: a key that leaks here is the key that
# unlocks a customer's whole applicant database.
[[rules]]
id = "cats-api-key"
description = "CATS API key assigned a literal value"
regex = '''(?i)cats_api_key\s*[:=]\s*['"]?([a-z0-9_\-]{20,})['"]?'''
secretGroup = 1
tags = ["key", "cats"]
