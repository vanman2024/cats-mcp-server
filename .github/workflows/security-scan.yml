name: Security Scan Pipeline

# This workflow replaced one scaffolded by /foundation:hooks-setup that could
# never have passed. It is worth recording why, because the failure was silent
# in a way that looked like flaky infrastructure:
#
#   * It ran actions/upload-artifact@v3, which GitHub now auto-fails at the
#     "Set up job" step. The job died before a single step executed, so the
#     logs showed no scan output and the check just read "failure".
#   * Every step shelled out to scripts/scan-secrets.sh, scan-dependencies.sh,
#     scan-owasp.sh and generate-security-report.sh. None of those files exist
#     in this repository. The scaffold assumed a companion install that never
#     happened, and three of the four calls were marked continue-on-error, so
#     even past the artifact bug the failure would have surfaced late and
#     unhelpfully.
#
# Everything below runs a tool that is actually fetched at run time.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories are noticed without a push.
    - cron: '0 2 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest

    # Read-only on purpose. Findings go to the job summary rather than a PR
    # comment: a comment needs pull-requests:write, which a fork PR cannot be
    # granted anyway, so the comment would fail exactly when an outside
    # contribution most needs the result.
    permissions:
      contents: read

    env:
      GITLEAKS_VERSION: '8.30.1'
      PIP_AUDIT_VERSION: '2.9.0'
      BANDIT_VERSION: '1.9.2'

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip. A key that is committed
          # and then deleted in a later commit of the same branch is still
          # published; a working-tree scan would call that branch clean.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --- Secrets ---------------------------------------------------------
      # Blocking. A leaked CATS key opens a customer's entire applicant
      # database, and the remedy is always the same and always available:
      # rotate the key and rewrite the commit.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        run: |
          ./gitleaks git . \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif

      # --- This repository's own code --------------------------------------
      # Blocking at high severity + high confidence only. The suppressed
      # findings are all understood: config.py binds 0.0.0.0 by default, which
      # is correct for a containerised HTTP server and is overridable; and
      # ratelimit.py uses random.uniform for retry jitter, which is not a
      # cryptographic use. Both are code-review calls, not build blockers, so
      # they are reported in the artifact rather than gating the branch.
      - name: Static analysis of src/
        run: |
          uvx "bandit@${BANDIT_VERSION}" -r src/ -f json -o bandit.json || true
          uvx "bandit@${BANDIT_VERSION}" -r src/ \
            --severity-level high \
            --confidence-level high

      # --- Dependencies ----------------------------------------------------
      # Reported, not blocking, and that is a deliberate and temporary choice.
      #
      # Every current finding sits in a transitive dependency that fastmcp
      # 4.0.0b2 pins - click, cryptography, requests, urllib3, pyjwt, pygments,
      # pydantic-settings, jaraco-context. No change to this repository's four
      # declared dependencies clears them. Gating on them would paint every PR
      # red for a condition no PR can fix, which trains people to merge past a
      # red check - a worse outcome than an honest amber one.
      #
      # `uv lock --upgrade` does clear them, but it moves the whole tree,
      # prereleases included. That is its own change with its own test run.
      # When it lands, drop the continue-on-error below and this comment with it.
      # continue-on-error, not `|| true`, so a finding still shows as an amber
      # annotation on the PR instead of vanishing into a green step.
      - name: Audit dependencies for known advisories
        id: audit
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --no-hashes --extra dev \
            --format requirements-txt -o requirements-audit.txt
          uvx "pip-audit@${PIP_AUDIT_VERSION}" --no-deps -r requirements-audit.txt \
            --format json --output pip-audit.json || true
          uvx "pip-audit@${PIP_AUDIT_VERSION}" --no-deps -r requirements-audit.txt \
            | tee pip-audit.txt

      # --- Reporting -------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Security scan"
            echo
            echo "| Scan | Gate | Result |"
            echo "|------|------|--------|"
            echo "| Secrets (gitleaks, full history) | blocking | see step status |"
            echo "| Static analysis (bandit, src/) | blocking above high/high | see step status |"
            echo "| Dependencies (pip-audit) | reported only | below |"
            echo
            if [ -s pip-audit.txt ]; then
              echo '<details><summary>Dependency advisories</summary>'
              echo
              echo '```'
              cat pip-audit.txt
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            gitleaks.sarif
            bandit.json
            pip-audit.json
            pip-audit.txt
          if-no-files-found: warn
